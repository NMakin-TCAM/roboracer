# robot_localization EKF for a forward-velocity estimate from the IMU alone (ekf.launch.py).
# Integrates the sim IMU's forward acceleration (plus yaw and yaw rate) into vx; corrector.py then
# removes the integration drift with the wheel encoders. Publishes /odometry/filtered_accl, no TF.
# Every option not set here is robot_localization's default (process noise and initial covariance too);
# its annotated template explains them: https://github.com/cra-ros-pkg/robot_localization/blob/humble-devel/params/ekf.yaml
ekf_filter_node_accl:
  ros__parameters:
    frequency: 15.0
    sensor_timeout: 0.1
    two_d_mode: true
    print_diagnostics: true
    publish_acceleration: true
    publish_tf: false              # Cartographer and wheel_odom own map -> odom -> base_link

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # No wheel odometry input (odom0): the encoders enter in corrector.py instead.

    imu0: /autodrive/roboracer_1/imu
    # x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: true   # fast_bridge adds gravity to the sim IMU
