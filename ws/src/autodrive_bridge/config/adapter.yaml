# AutoDRIVE RoboRacer (2026-iros practice build), measured 2026-10-04.
# Parameters not listed here use the defaults in adapter.py / wheel_odom.py.
# max_steering_angle and wheelbase come from control/config/vehicle.yaml.
adapter:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    odom_topic: /odom           # measured speed for the throttle loop (wheel_odom)
    laser_x: 0.2733             # rear axle -> lidar
    speed_kff: 0.04             # throttle per m/s; sim settles at ~25 m/s per unit throttle
    speed_kp: 0.006
    speed_ki: 0.006
    speed_i_max: 1.0
    max_throttle: 1.0
    cmd_timeout: 0.5
    auto_unstick: false

wheel_odom:
  ros__parameters:
    vehicle_ns: /autodrive/roboracer_1
    wheel_radius: 0.0585        # m; calibrated 2026-10-11: /odom speed matches /ground_truth/odom
    speed_window: 0.1           # s; speed is averaged over this window
    publish_tf: true            # TF odom -> base_link, as vesc_to_odom does; Cartographer adds map -> odom
    use_imu_yaw_rate: true      # gyro yaw rate; the steering model under-reads turns by ~45%
